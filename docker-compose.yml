services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fishora
      POSTGRES_PASSWORD: fishora
      POSTGRES_DB: fishora
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fishora -d fishora"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - fishora_pgdata:/var/lib/postgresql/data

  main-api:
    build:
      context: .
      dockerfile: deploy/main-api.Dockerfile
    environment:
      FISHORA_DATABASE_URL: postgresql+psycopg://fishora:fishora@db:5432/fishora
      FISHORA_CV_SERVICE_URL: http://cv-service:8001
      FISHORA_CV_TIMEOUT_SECONDS: ${FISHORA_CV_TIMEOUT_SECONDS:-30}
      FISHORA_CV_MAX_IMAGE_BYTES: ${FISHORA_CV_MAX_IMAGE_BYTES:-10485760}
      FISHORA_IMAGE_STORAGE_DIR: /var/lib/fishora/images
      FISHORA_EMBEDDING_MODEL_NAME: intfloat/multilingual-e5-base
      FISHORA_EMBEDDING_DIMENSION: 768
      FISHORA_OPENCODE_GO_BASE_URL: ${FISHORA_OPENCODE_GO_BASE_URL:-https://opencode.ai/zen/go/v1}
      FISHORA_OPENCODE_GO_MODEL: ${FISHORA_OPENCODE_GO_MODEL:-gpt-5.6-luna}
      FISHORA_OPENCODE_GO_TIMEOUT_SECONDS: ${FISHORA_OPENCODE_GO_TIMEOUT_SECONDS:-60}
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - fishora_images:/var/lib/fishora/images
      - fishora_hf_cache:/root/.cache/huggingface

  cv-service:
    profiles: [gpu]
    build:
      context: .
      dockerfile: deploy/cv-service.Dockerfile
    environment:
      FISHORA_CV_EXPORT_DIR: /opt/fishora/model/export
      FISHORA_CV_DEVICE: ${FISHORA_CV_DEVICE:-cuda}
      FISHORA_CV_MODEL_VERSION: ${FISHORA_CV_MODEL_VERSION:-fishora-dinov3-export}
      FISHORA_CV_MAX_IMAGE_BYTES: ${FISHORA_CV_MAX_IMAGE_BYTES:-10485760}
    ports:
      - "8001:8001"
    volumes:
      - ${CV_EXPORT_DIR:-./ai/results/fishora_dinov3_large_frozen/export}:/opt/fishora/model/export:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  fishora_pgdata:
  fishora_images:
  fishora_hf_cache:
