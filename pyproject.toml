[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fishora"
version = "0.1.0"
description = "Fishora: fish identification RAG backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "pydantic-settings",
    "python-multipart",
    "pillow",
    "httpx",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic",
    "pgvector",
    "openai",
    "sentence-transformers",
]

[project.optional-dependencies]
cv = ["torch", "torchvision", "timm"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["apps*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a running PostgreSQL/pgvector database",
    "real_artifact: requires real dataset artifacts on disk",
]